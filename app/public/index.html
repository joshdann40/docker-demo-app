<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <p class="eyebrow">Demo app</p>
        <h1>User Profile Manager</h1>
        <p class="intro">
          A small Docker-ready app with a static frontend, Express backend, and
          MongoDB storage.
        </p>
        <div class="status-row">
          <span class="status-label">Database status</span>
          <span id="status-pill" class="status-pill">Checking...</span>
        </div>
      </section>

      <section class="card">
        <h2>Create Profile</h2>
        <form id="user-form" class="form">
          <label>
            Name
            <input type="text" id="name" name="name" placeholder="Jane Doe" required />
          </label>
          <label>
            Email
            <input
              type="email"
              id="email"
              name="email"
              placeholder="jane@example.com"
              required
            />
          </label>
          <label>
            Age
            <input type="number" id="age" name="age" min="0" placeholder="28" />
          </label>
          <button type="submit">Save Profile</button>
        </form>
        <p id="form-message" class="message"></p>
      </section>

      <section class="card">
        <div class="section-heading">
          <h2>Saved Profiles</h2>
          <button id="refresh-button" class="secondary-button" type="button">
            Refresh
          </button>
        </div>
        <div id="users-list" class="users-list"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
